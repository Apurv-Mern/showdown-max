<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity Web Player | CardSuffle</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">CardSuffle</div>
    </div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    // Show warning/error banners
    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");

      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? "block" : "none";
      }

      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type === "error") {
        div.style = "background: red; color: white; padding: 10px;";
      } else {
        if (type === "warning") {
          div.style = "background: yellow; color: black; padding: 10px;";
        }

        setTimeout(function () {
          if (div.parentNode) {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }
        }, 5000);
      }

      updateBannerVisibility();
    }

    // Build folder path
    var buildUrl = "Build";

    // Unity loader file
    var loaderUrl = buildUrl + "/Kangaroo_Build.loader.js";

    // Unity WebGL configuration (Brotli compressed files)
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/Kangaroo_Build.data.br",
      frameworkUrl: buildUrl + "/Kangaroo_Build.framework.js.br",
      codeUrl: buildUrl + "/Kangaroo_Build.wasm.br",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "CardSuffle",
      productVersion: "0.1.0",
      showBanner: unityShowBanner
    };

    // Mobile device support
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");
      meta.name = "viewport";
      meta.content =
        "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
      document.head.appendChild(meta);

      document.querySelector("#unity-container").className = "unity-mobile";
      canvas.className = "unity-mobile";

      // Optional for better mobile performance:
      // config.devicePixelRatio = 1;
    } else {
      // Desktop canvas size
      canvas.style.width = "1920px";
      canvas.style.height = "1080px";
    }

    // Show loading bar
    document.querySelector("#unity-loading-bar").style.display = "block";

    // Load Unity loader script
    var script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#unity-progress-bar-full").style.width =
          (100 * progress) + "%";
      })
      .then(function (unityInstance) {
        // Hide loading bar
        document.querySelector("#unity-loading-bar").style.display = "none";

        // Fullscreen button
        document.querySelector("#unity-fullscreen-button").onclick = function () {
          unityInstance.SetFullscreen(1);
        };
      })
      .catch(function (message) {
        alert(message);
      });
    };

    script.onerror = function () {
      alert("Unable to load Unity loader script: " + loaderUrl);
    };

    // Add loader script to page
    document.body.appendChild(script);
  </script>
</body>
</html>
